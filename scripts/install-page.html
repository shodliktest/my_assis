<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0F6B63" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="{{APP_NAME}}" />
  <title>Add {{APP_NAME}} to your Home Screen</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/pwa/icon-180.png" />
  <link rel="stylesheet" href="/pwa/install/styles.css" />
</head>
<body>
  <main class="page">
    <section class="copy">
      <h1>Add {{APP_NAME}} to your Home Screen</h1>
      <p>On iPhone or iPad, open the browser share menu and choose <strong>Add to Home Screen</strong>.</p>
      <p>On Android, use the browser menu and choose <strong>Install app</strong> or <strong>Add to Home screen</strong>.</p>
      <a class="desktop-open" href="{{APP_URL}}">Open {{APP_NAME}}</a>
    </section>
  </main>
</body>
</html>
